<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Pets | PetSafe</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f1f5f9; color: #0f172a; min-height: 100vh; }
    
    /* SIDEBAR */
    .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0;
        width: 250px; background: #0f172a; color: white;
        padding: 24px 16px; display: flex; flex-direction: column; z-index: 1000;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 5px 10px 30px; }
    .brand-icon {
        width: 42px; height: 42px; border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #2563eb, #38bdf8); font-size: 21px;
    }
    .brand h2 { font-size: 17px; }
    .brand span { display: block; color: #94a3b8; font-size: 11px; margin-top: 2px; }
    .nav-title { color: #64748b; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 0 12px 10px; }
    .nav { display: flex; flex-direction: column; gap: 5px; }
    .nav a {
        display: flex; align-items: center; gap: 12px; padding: 12px;
        color: #cbd5e1; text-decoration: none; border-radius: 9px; font-size: 14px; transition: 0.2s ease;
    }
    .nav a:hover { background: #1e293b; color: white; }
    .nav a.active { background: #2563eb; color: white; box-shadow: 0 5px 15px rgba(37, 99, 235, 0.25); }
    .nav-icon { width: 22px; text-align: center; font-size: 17px; }
    
    .sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid #1e293b; }
    .user-info { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 8px; }
    .avatar {
        width: 38px; height: 38px; border-radius: 50%; background: #2563eb;
        display: flex; align-items: center; justify-content: center; font-weight: 700; color: white;
    }
    .user-details strong { display: block; font-size: 13px; }
    .user-details span { color: #94a3b8; font-size: 11px; }
    .logout-btn {
        display: flex; align-items: center; gap: 10px; padding: 11px 12px;
        background: #1e293b; color: #fca5a5; text-decoration: none; border-radius: 9px;
        font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #334155;
    }
    .logout-btn:hover { background: #7f1d1d; color: white; }

    /* MAIN CONTENT */
    .main { margin-left: 250px; min-height: 100vh; }
    .topbar {
        height: 76px; background: white; border-bottom: 1px solid #e2e8f0;
        display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
    }
    .topbar h1 { font-size: 20px; font-weight: 700; }
    .topbar p { color: #64748b; font-size: 13px; margin-top: 3px; }
    .content { padding: 30px 32px; }

    .grid-container {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 20px;
    }

    .panel {
        background: white; border: 1px solid #e2e8f0;
        border-radius: 14px; padding: 20px;
    }
    .panel h3 { font-size: 16px; margin-bottom: 15px; color: #0f172a; }

    /* FORM STYLES */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 5px; }
    .form-group input, .form-group select {
        width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1;
        border-radius: 8px; font-size: 13px; outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: #2563eb; }
    
    .btn-submit {
        background: #2563eb; color: white; border: none; padding: 10px 16px;
        border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
    }
    .btn-submit:hover { background: #1d4ed8; }

    /* PETS TABLE/LIST */
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8fafc; color: #64748b; text-align: left; padding: 10px; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; }
    td { padding: 12px 10px; border-bottom: 1px solid #f1f5f9; font-size: 13px; color: #334155; }
    
    .footer { text-align: center; color: #94a3b8; font-size: 11px; padding: 25px; }

    @media (max-width: 900px) {
        .grid-container { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<aside class="sidebar">
    <div class="brand">
        <div class="brand-icon">🐾</div>
        <div class="brand-text">
            <h2>PetSafe</h2>
            <span>Monitoring System</span>
        </div>
    </div>
    <div class="nav-title">Main Menu</div>
    <nav class="nav">
        <a href="index.html"><span class="nav-icon">📊</span><span>Dashboard</span></a>
        <a href="pets.html" class="active"><span class="nav-icon">🐶</span><span>My Pets</span></a>
        <a href="location.html"><span class="nav-icon">📍</span><span>Location</span></a>
        <a href="logs.html"><span class="nav-icon">🔔</span><span>Safety Alerts</span></a>
        <a href="monitoring.html"><span class="nav-icon">📡</span><span>Monitoring</span></a>
    </nav>
    <div class="sidebar-footer">
        <div class="user-info">
            <div class="avatar" id="userAvatar">A</div>
            <div class="user-details">
                <strong id="userName">admin</strong>
                <span id="userRole">ADMIN</span>
            </div>
        </div>
        <a class="logout-btn" onclick="logout()"><span>🚪</span><span>Logout</span></a>
    </div>
</aside>

<main class="main">
    <header class="topbar">
        <div>
            <h1>My Pets Management</h1>
            <p>Register and view your pets connected to Supabase.</p>
        </div>
    </header>

    <section class="content">
        <div class="grid-container">
            <!-- ADD PET FORM -->
            <div class="panel">
                <h3>➕ Add New Pet</h3>
                <form id="add-pet-form" onsubmit="addPet(event)">
                    <div class="form-group">
                        <label>Pet Name</label>
                        <input type="text" id="pet_name" required placeholder="Ex. Bantay">
                    </div>
                    <div class="form-group">
                        <label>Species</label>
                        <select id="species">
                            <option value="Dog">Dog 🐶</option>
                            <option value="Cat">Cat 🐱</option>
                            <option value="Bird">Bird 🐦</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Breed / Description</label>
                        <input type="text" id="breed" placeholder="Ex. Aspin / Brown">
                    </div>
                    <button type="submit" class="btn-submit">Save Pet</button>
                </form>
            </div>

            <!-- PETS LIST -->
            <div class="panel">
                <h3>📋 Registered Pets List</h3>
                <div id="pets-table-area">
                    ⏳ Loading pets...
                </div>
            </div>
        </div>

        <div class="footer">PetSafe Monitoring System</div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
    // Check login state
    const user = requireLogin();
    if (user) {
        document.getElementById('userAvatar').textContent = user.username[0].toUpperCase();
        document.getElementById('userName').textContent = user.username;
        document.getElementById('userRole').textContent = user.role || 'Admin';
    }

    // Load Pets gikan sa Supabase
    async function loadPets() {
        const area = document.getElementById('pets-table-area');
        const { data: pets, error } = await supabaseClient.from('pets').select('*');

        if (error) {
            area.innerHTML = `<div style="color:#dc2626;">Error: ${error.message}</div>`;
            return;
        }

        if (!pets || pets.length === 0) {
            area.innerHTML = `<p style="color:#64748b; text-align:center; padding: 20px;">Wala pay rehistradong binuhi.</p>`;
            return;
        }

        let rows = '';
        pets.forEach(p => {
            let emoji = p.species?.toLowerCase().includes('cat') ? '🐱' : (p.species?.toLowerCase().includes('bird') ? '🐦' : '🐶');
            rows += `
                <tr>
                    <td><strong>${emoji} ${p.pet_name}</strong></td>
                    <td>${p.species || 'N/A'}</td>
                    <td>${p.breed || '-'}</td>
                </tr>`;
        });

        area.innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Species</th>
                        <th>Breed</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>`;
    }

    // Function sa pagdugang og Pet padulong sa Supabase
    async function addPet(event) {
        event.preventDefault();
        
        const pet_name = document.getElementById('pet_name').value;
        const species = document.getElementById('species').value;
        const breed = document.getElementById('breed').value;

        const { error } = await supabaseClient
            .from('pets')
            .insert([{ pet_name, species, breed }]);

        if (error) {
            alert('Error sa pagdugang: ' + error.message);
        } else {
            alert('Nindot! Na-save na ang binuhi.');
            document.getElementById('add-pet-form').reset();
            loadPets(); // I-refresh ang listahan
        }
    }

    loadPets();
</script>
</body>
</html>
