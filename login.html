<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | PetSafe</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: Inter, -apple-system, BlinkMacSystemFont,
                     "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 20px;
    }
    .login-card {
        background: white; border-radius: 18px;
        padding: 40px; width: 100%; max-width: 420px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .brand { text-align: center; margin-bottom: 30px; }
    .brand-icon {
        width: 70px; height: 70px; border-radius: 18px;
        background: linear-gradient(135deg, #2563eb, #38bdf8);
        display: flex; align-items: center; justify-content: center;
        font-size: 36px; margin: 0 auto 15px;
    }
    .brand h1 { font-size: 26px; color: #0f172a; margin-bottom: 5px; }
    .brand p { color: #64748b; font-size: 13px; }
    .form-group { margin-bottom: 18px; }
    label {
        display: block; font-size: 12px; font-weight: 600;
        color: #334155; margin-bottom: 6px;
    }
    input {
        width: 100%; padding: 12px 14px;
        border: 1px solid #e2e8f0; border-radius: 10px;
        font-size: 14px; font-family: inherit;
        background: #f8fafc; transition: 0.2s;
    }
    input:focus {
        outline: none; border-color: #2563eb;
        background: white;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .btn {
        width: 100%; padding: 13px;
        background: #2563eb; color: white;
        border: none; border-radius: 10px;
        font-size: 15px; font-weight: 600;
        cursor: pointer; transition: 0.2s;
        font-family: inherit; margin-top: 8px;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #94a3b8; cursor: wait; }
    .alert {
        padding: 12px 16px; border-radius: 9px;
        margin-bottom: 18px; font-size: 13px;
        display: none;
    }
    .alert.error {
        background: #fef2f2; color: #b91c1c;
        border: 1px solid #fecaca; display: block;
    }
    .alert.success {
        background: #ecfdf5; color: #047857;
        border: 1px solid #a7f3d0; display: block;
    }
    .info {
        margin-top: 20px; padding: 12px;
        background: #eff6ff; border-radius: 9px;
        font-size: 12px; color: #1e40af;
        text-align: center; line-height: 1.6;
    }
    .info code {
        background: #dbeafe; padding: 2px 6px;
        border-radius: 4px; font-weight: 700;
    }
</style>
</head>
<body>

<div class="login-card">
    <div class="brand">
        <div class="brand-icon">🐾</div>
        <h1>PetSafe</h1>
        <p>Monitoring System</p>
    </div>

    <div id="alert" class="alert"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn" id="loginBtn">Login</button>
    </form>

    <div class="info">
        <strong>Demo credentials:</strong><br>
        Username: <code>admin</code> | Password: <code>admin123</code>
    </div>
</div>

<!-- Supabase JS v2 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const btn = document.getElementById('loginBtn');
        const alertBox = document.getElementById('alert');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.textContent = 'Logging in...';
        alertBox.className = 'alert';

        try {
            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('username', username)
                .eq('password', password)
                .single();

            if (error || !data) {
                throw new Error('Invalid username or password');
            }

            // Save user to localStorage
            localStorage.setItem('petsafe_user', JSON.stringify({
                id: data.id,
                username: data.username,
                role: data.role
            }));

            alertBox.className = 'alert success';
            alertBox.textContent = '✅ Login successful! Redirecting...';

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 800);

        } catch (err) {
            alertBox.className = 'alert error';
            alertBox.textContent = '⚠️ ' + err.message;
            btn.disabled = false;
            btn.textContent = 'Login';
        }
    });
</script>

</body>
</html>
