<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | PetSafe</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: Inter, -apple-system, BlinkMacSystemFont,
                     "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #0f172a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .login-container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    }

    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-logo {
        width: 70px;
        height: 70px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2563eb, #38bdf8);
        font-size: 34px;
        margin: 0 auto 18px;
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
    }

    .login-header h1 {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .login-header p {
        color: #64748b;
        font-size: 13px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: #334155;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 7px;
    }

    .form-group input {
        width: 100%;
        padding: 13px 15px;
        border: 1.5px solid #e2e8f0;
        border-radius: 10px;
        font-size: 14px;
        outline: none;
        transition: 0.2s;
        font-family: inherit;
    }

    .form-group input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn-login {
        width: 100%;
        padding: 14px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 8px;
    }

    .btn-login:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }

    .btn-login:disabled {
        background: #94a3b8;
        cursor: not-allowed;
        transform: none;
    }

    .error-msg {
        background: #fef2f2;
        color: #dc2626;
        padding: 12px 15px;
        border-radius: 10px;
        font-size: 13px;
        margin-bottom: 18px;
        border-left: 3px solid #dc2626;
        display: none;
    }

    .error-msg.show {
        display: block;
    }

    .info-box {
        background: #eff6ff;
        color: #1d4ed8;
        padding: 12px 15px;
        border-radius: 10px;
        font-size: 12px;
        margin-top: 20px;
        border-left: 3px solid #2563eb;
        line-height: 1.5;
    }

    .info-box strong {
        display: block;
        margin-bottom: 4px;
    }

    .loading-spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <div class="login-logo">🐾</div>
        <h1>PetSafe</h1>
        <p>Monitoring System Login</p>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Username</label>
            <input type="text"
                   id="username"
                   placeholder="Enter username"
                   required
                   autocomplete="username"
                   value="admin">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password"
                   id="password"
                   placeholder="Enter password"
                   required
                   autocomplete="current-password"
                   value="admin123">
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
            🚪 Login
        </button>
    </form>

    <div class="info-box">
        <strong>💡 Demo Credentials:</strong>
        Username: <code>admin</code><br>
        Password: <code>admin123</code>
    </div>
</div>

<script>
    // =========================================================
    // LOGIN LOGIC
    // =========================================================

    // If already logged in, go to dashboard
    const existingUser = localStorage.getItem('petsafe_user');
    if (existingUser) {
        window.location.href = 'index.html';
    }

    function handleLogin(event) {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        // Hide previous error
        errorMsg.classList.remove('show');

        // Show loading
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span>Logging in...';

        // Simulate small delay (para feeling natural)
        setTimeout(() => {
            // Simple hardcoded credential check
            // (Pwede nimo i-ilis sa Supabase Auth kung gusto nimo)
            if (username === 'admin' && password === 'admin123') {

                // Save user to localStorage
                const user = {
                    username: username,
                    role: 'ADMIN',
                    loginTime: new Date().toISOString()
                };

                localStorage.setItem('petsafe_user', JSON.stringify(user));

                // Redirect to dashboard
                window.location.href = 'index.html';

            } else {
                // Show error
                errorMsg.textContent = '❌ Sayop ang username o password. Try: admin / admin123';
                errorMsg.classList.add('show');

                btn.disabled = false;
                btn.innerHTML = '🚪 Login';
            }
        }, 600);
    }
</script>

</body>
</html>
