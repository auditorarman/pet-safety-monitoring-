<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetSafe IoT - Live Tracking (Real GPS)</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
body {
font-family: Arial, sans-serif;
margin: 0;
padding: 0;
background-color: #f4f6f9;
}
header {
background-color: #1e293b;
color: white;
padding: 15px 20px;
font-size: 1.25rem;
font-weight: bold;
}
#map {
height: 80vh;
width: 100%;
}
#status-panel {
padding: 15px 20px;
background: white;
display: flex;
justify-content: space-between;
align-items: center;
box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
}
.badge {
padding: 6px 12px;
border-radius: 20px;
font-weight: bold;
color: white;
}
.safe { background-color: #22c55e; }
.danger { background-color: #ef4444; }
</style>
</head>
<body>

<header>🐾 PetSafe IoT - Real-Time Device GPS Tracking</header>

<div id="map"></div>

<div id="status-panel">
<div>
<strong>Status:</strong> <span id="safety-status" class="badge safe">Naghulat sa GPS...</span>
</div>
<div>
<strong>Imong GPS Coordinates:</strong> <span id="coords-text">Nag-kuha sa tinuod nga GPS...</span>
</div>
<div>
<strong>Kataposang Update:</strong> <span id="last-update">-</span>
</div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// Sugdan ang mapa sa walay gi-hardcode nga pwesto (magsugod sa default, i-center dayon sa GPS)
var map = L.map('map').setView([10.3157, 123.8854], 13); // Default center sa Cebu

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
maxZoom: 19,
attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

var petMarker = null;
var isFirstCenter = true;

// Gamiton ang tinuod nga Browser GPS (Geolocation API)
if ("geolocation" in navigator) {
navigator.geolocation.watchPosition(
(position) => {
let lat = position.coords.latitude;
let lng = position.coords.longitude;

console.log("Tinuod nga GPS sa imong Device:", lat, lng);

// I-update ang UI text
document.getElementById("coords-text").innerText = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
document.getElementById("last-update").innerText = new Date().toLocaleTimeString();

// Kung wala pa ma-himo ang marker, himoa. Kung naa na, i-move lang.
if (!petMarker) {
petMarker = L.marker([lat, lng]).addTo(map)
.bindPopup("<b>Imong Live GPS Location</b>")
.openPopup();
} else {
petMarker.setLatLng([lat, lng]);
}

// I-center dayon sa imong saktong lokasyon (Cebu man o Bohol) sa unang kuha
if (isFirstCenter) {
map.setView([lat, lng], 17);
isFirstCenter = false;
}

let badge = document.getElementById("safety-status");
badge.className = "badge safe";
badge.innerText = "✅ GPS Connected (Aktibo)";
},
(error) => {
console.error("Error sa pagkuha sa GPS:", error.message);
document.getElementById("coords-text").innerText = "Dili makuha ang GPS (I-allow ang Location Permission)";
let badge = document.getElementById("safety-status");
badge.className = "badge danger";
badge.innerText = "🚨 GPS Error / Gihikawan";
},
{
enableHighAccuracy: true, // Siguraduhon nga sakto ug kusog ang GPS
maximumAge: 0,
timeout: 10000
}
);
} else {
alert("Ang imong browser kay wala nagasuporta sa Geolocation.");
}
</script>
</body>
</html>
