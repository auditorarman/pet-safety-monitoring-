<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetSafe IoT - Live Tracking</title>
    
    <!-- Leaflet CSS para sa Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
        }
        header {
            background-color: #1e293b;
            color: white;
            padding: 15px 20px;
            font-size: 1.25rem;
            font-weight: bold;
        }
        #map {
            height: 80vh;
            width: 100%;
        }
        #status-panel {
            padding: 15px 20px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        }
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
        }
        .safe { background-color: #22c55e; }
        .danger { background-color: #ef4444; }
    </style>
</head>
<body>

    <header>🐾 PetSafe IoT - Real-Time Pet Tracking System</header>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Status Panel sa ubos sa mapa -->
    <div id="status-panel">
        <div>
            <strong>Status:</strong> <span id="safety-status" class="badge safe">Nagpahulat sa data...</span>
        </div>
        <div>
            <strong>Coordinates:</strong> <span id="coords-text">Wala pa'y GPS fix</span>
        </div>
        <div>
            <strong>Kataposang Update:</strong> <span id="last-update">-</span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Supabase Credentials gikan sa imong ESP32 code
        const SUPABASE_URL = "https://sqpneocapdetejhsfpzk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_A0NA-xH5v88AzikE_F73Tg_zc84qRZW";

        // Sugdan ang mapa (Default center sa Bohol / Pilipinas, i-adjust dayon sa code kung naa nay data)
        var map = L.map('map').setView([9.8500, 124.1433], 15);

        // Butangan og OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Himoan og Marker ang iro
        var petMarker = L.marker([9.8500, 124.1433]).addTo(map)
            .bindPopup("<b>Ang Imong Iro (Buddy)</b><br>Nag-atabang sa live GPS update...")
            .openPopup();

        var isFirstCenter = true;

        // Function sa pagkuha sa pinakabag-ong lokasyon gikan sa Supabase table nga 'location_logs'
        async function fetchLatestPetLocation() {
            try {
                let response = await fetch(`${SUPABASE_URL}/rest/v1/location_logs?select=*&order=id.desc&limit=1`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                let data = await response.json();
                if (data.length > 0) {
                    let latest = data[0];
                    let lat = latest.latitude;
                    let lng = latest.longitude;
                    let safetyStatus = latest.safety_status; // "safe" o "danger"
                    
                    console.log("Live GPS gikan sa ESP32:", lat, lng, "Status:", safetyStatus);

                    // I-update ang posisyon sa marker sa mapa
                    petMarker.setLatLng([lat, lng]);
                    
                    // I-center ang mapa sa iro kung kana ang unang kuha o gusto nimo sundon
                    if (isFirstCenter) {
                        map.setView([lat, lng], 17);
                        isFirstCenter = false;
                    }

                    // I-update ang UI text sa ubos
                    document.getElementById("coords-text").innerText = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                    document.getElementById("last-update").innerText = new Date().toLocaleTimeString();

                    let badge = document.getElementById("safety-status");
                    if (safetyStatus === "danger") {
                        badge.className = "badge danger";
                        badge.innerText = "🚨 DANGER (Lapas sa 1km Zone!)";
                    } else {
                        badge.className = "badge safe";
                        badge.innerText = "✅ SAFE (Naa sa Safe Zone)";
                    }
                }
            } catch (error) {
                console.error("Error sa pagkuha sa location gikan sa Supabase:", error);
            }
        }

        // Tawgon ang function kada 4 ka segundos aron mag-sige og update ang live map
        setInterval(fetchLatestPetLocation, 4000);

        // Tawgon dayon pag-load sa page
        fetchLatestPetLocation();
    </script>
</body>
</html>
