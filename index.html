<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetSafe IoT - Live Tracking</title>
    
    <!-- Leaflet CSS para sa Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
        }
        header {
            background-color: #1e293b;
            color: white;
            padding: 15px 20px;
            font-size: 1.25rem;
            font-weight: bold;
        }
        #map {
            height: 80vh;
            width: 100%;
        }
        #status-panel {
            padding: 15px 20px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        }
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
        }
        .safe { background-color: #22c55e; }
        .danger { background-color: #ef4444; }
    </style>
</head>
<body>

    <header>🐾 PetSafe IoT - Real-Time Pet Tracking System</header>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Status Panel sa ubos sa mapa -->
    <div id="status-panel">
        <div>
            <strong>Status:</strong> <span id="safety-status" class="badge safe">Nagpahulat sa data...</span>
        </div>
        <div>
            <strong>Coordinates:</strong> <span id="coords-text">Wala pa'y GPS fix</span>
        </div>
        <div>
            <strong>Kataposang Update:</strong> <span id="last-update">-</span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Supabase JS Client (Alang sa real-time WebSocket) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // Supabase Credentials gikan sa imong ESP32 code
        const SUPABASE_URL = "https://sqpneocapdetejhsfpzk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_A0NA-xH5v88AzikE_F73Tg_zc84qRZW";

        // Initialize Supabase Client
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // Sugdan ang mapa (Default center sa Bohol / Pilipinas, i-adjust dayon sa code kung naa nay data)
        var map = L.map('map').setView([9.8500, 124.1433], 15);

        // Butangan og OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Himoan og Marker ang iro
        var petMarker = L.marker([9.8500, 124.1433]).addTo(map)
            .bindPopup("<b>Ang Imong Iro (Buddy)</b><br>Naghulat sa real-time WebSocket...")
            .openPopup();

        var isFirstCenter = true;

        // Function sa pag-update sa UI ug Mapa
        function updatePetUI(lat, lng, safetyStatus) {
            console.log("Live GPS Data gikan sa Network:", lat, lng, "Status:", safetyStatus);

            // I-update ang posisyon sa marker sa mapa
            petMarker.setLatLng([lat, lng]);
            
            // I-center ang mapa sa iro sa unang pagkuha sa data
            if (isFirstCenter) {
                map.setView([lat, lng], 17);
                isFirstCenter = false;
            }

            // I-update ang UI text sa ubos
            document.getElementById("coords-text").innerText = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            document.getElementById("last-update").innerText = new Date().toLocaleTimeString();

            let badge = document.getElementById("safety-status");
            if (safetyStatus === "danger") {
                badge.className = "badge danger";
                badge.innerText = "🚨 DANGER (Lapas sa 1km Zone!)";
            } else {
                badge.className = "badge safe";
                badge.innerText = "✅ SAFE (Naa sa Safe Zone)";
            }
        }

        // 1. Kuhaon ang pinakabag-ong lokasyon sa pag-load sa panid (Initial fetch)
        async function fetchInitialLocation() {
            try {
                let { data, error } = await _supabase
                    .from('location_logs')
                    .select('*')
                    .order('id', { ascending: false })
                    .limit(1);

                if (error) throw error;

                if (data && data.length > 0) {
                    let latest = data[0];
                    updatePetUI(latest.latitude, latest.longitude, latest.safety_status);
                }
            } catch (error) {
                console.error("Error sa pagkuha sa location gikan sa Supabase:", error);
            }
        }

        // Tawgon dayon pag-load sa page
        fetchInitialLocation();

        // 2. Maminaw sa Realtime Database Changes (WebSocket - instant update nga walay sige og interval/refresh)
        const locationChannel = _supabase.channel('public:location_logs')
            .on(
                'postgres_changes',
                { event: 'INSERT', schema: 'public', table: 'location_logs' },
                (payload) => {
                    let latest = payload.new;
                    updatePetUI(latest.latitude, latest.longitude, latest.safety_status);
                }
            )
            .subscribe();
    </script>
</body>
</html>
